server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # K8s / 负载均衡探活
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA：前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不长期缓存，便于发版后尽快拿到新版本
    location = /index.html {
        expires -1;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }

    # 带 hash 的静态资源可长期缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control 'public, max-age=604800, immutable';
        try_files $uri =404;
    }

    # 若希望 API 与前端同域，可在构建时把 UMI_APP_API_BASE_URL 设为同源，
    # 并取消下面注释，将 BACKEND_UPSTREAM 替换为后端 Service 地址（如 http://agent-server:3030）
    #
    # location /admin/ {
    #     proxy_pass http://agent-server:3030/admin/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
